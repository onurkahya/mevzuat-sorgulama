<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mevzuat Madde Sorgulama Sistemi</title>
<style>
:root{--dark:#050e3a;--navy:#0b1e6d;--card:#142b83;--gold:#f4c430;--red:#c0392b;--text:#edf2ff;--muted:#b9c6ee}
*{box-sizing:border-box}
body{margin:0;font-family:'Arial Narrow',Arial,Helvetica,sans-serif;background:linear-gradient(145deg,var(--dark),#0b1553 55%,#101b62);color:var(--text);min-height:100vh}
.topline{height:5px;background:var(--red)}
header{text-align:center;padding:30px 18px 20px}
.tc{font-size:13px;letter-spacing:2px;color:var(--gold);font-weight:800}
h1{margin:8px 0 6px;font-size:29px}
header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:1050px;margin:auto;padding:18px 20px 50px}
.card{background:rgba(20,43,131,.93);border:1px solid rgba(244,196,48,.35);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 16px 45px rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;color:var(--gold);font-size:13px;font-weight:800;margin-bottom:7px}
select,button{width:100%;padding:13px 14px;border-radius:9px;font-size:15px}
select{background:#fff;color:#111;border:1px solid #d9d9d9}
button{cursor:pointer;background:var(--gold);color:#111;font-weight:800;border:0}
button.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.status{margin-top:15px;padding:12px 14px;border-radius:9px;background:rgba(0,0,0,.2);font-size:13px;line-height:1.5}
.good{border-left:4px solid #61d095}.warn{border-left:4px solid var(--gold)}.bad{border-left:4px solid #ff7979}
.result{background:#fff;color:#111;border-radius:14px;padding:18px 22px;min-height:200px}
.result h2{margin:0 0 5px;color:#071960;font-size:18px}.article-title{font-size:16px;font-weight:800;color:#111;margin:0 0 5px;padding-bottom:5px;border-bottom:1px solid #ddd}
.meta{font-size:10.5px;color:#555;border-bottom:1px solid #ddd;padding-bottom:6px;margin-bottom:8px;line-height:1.2}
.body{white-space:normal;line-height:1.28;font-size:13.5px}
a{color:#0b3aa4}
@media(max-width:700px){.grid,.actions{grid-template-columns:1fr}h1{font-size:23px}}
@media print{
 body{background:#fff;color:#000}
 .topline,header,.query{display:none!important}
 main{max-width:none;padding:0}
 .card{background:#fff;border:0;box-shadow:none;padding:0}
 .result{padding:0}
}
</style>
</head>
<body>
<div class="topline"></div>
<header>
 <div class="tc">T.C. MEVZUAT MADDE SORGULAMA</div>
 <h1>Mevzuat Madde Sorgulama Sistemi</h1>
 <p>Canlı kaynak: mevzuat.gov.tr</p>
</header>
<main>
<section class="card query">
 <div class="grid">
  <div>
   <label>MEVZUAT</label>
   <select id="law">
    {% for key,item in mevzuatlar.items() %}
    <option value="{{key}}">{{item.ad}}</option>
    {% endfor %}
   </select>
  </div>
  <div>
   <label>MADDE NUMARASI</label>
   <select id="article" disabled><option>Güncel metin yükleniyor...</option></select>
  </div>
 </div>
 <div class="actions">
  <button onclick="loadLaw()">Güncel Metni Yeniden Getir</button>
  <button class="secondary" onclick="window.print()">PDF / Yazdır</button>
 </div>
 <div id="status" class="status warn">Canlı kaynakla bağlantı kuruluyor...</div>
</section>

<section class="card">
 <div class="result" id="result">
  <h2>Madde metni</h2>
  <div class="article-title" id="articleTitle"></div>
  <div class="meta">Bir madde seçildiğinde güncel metin burada gösterilir.</div>
  <div class="body"></div>
 </div>
</section>
</main>

<script>
let current=null;

async function loadLaw(){
 const key=document.getElementById("law").value;
 const sel=document.getElementById("article");
 const st=document.getElementById("status");
 st.className="status warn";
 st.textContent="Mevzuat.gov.tr üzerinden güncel metin alınıyor...";
 sel.disabled=true;
 sel.innerHTML="<option>Yükleniyor...</option>";
 try{
   const response=await fetch("/api/mevzuat/"+encodeURIComponent(key),{cache:"no-store"});
   const d=await response.json();
   if(!d.ok) throw new Error(d.error||"Veri alınamadı.");
   current=d;
   sel.innerHTML="";
   d.articles.forEach((a,i)=>{
      const o=document.createElement("option");
      o.value=i; o.textContent=a.etiket; sel.appendChild(o);
   });
   sel.disabled=false;
   sel.onchange=showArticle;
   showArticle();

   if(d.from_cache){
      st.className="status warn";
      st.textContent="Canlı kaynak o anda alınamadı. Son başarılı kopya gösteriliyor. Kayıt zamanı: "+(d.cache_time||"-");
   }else{
      st.className="status good";
      const src=d.source_type==="canli_html" ? "Canlı HTML" : "Resmî PDF";
      const sslNote=d.ssl_fallback ? " — SSL doğrulama yedeği kullanıldı" : "";
      st.textContent="Güncel kaynak başarılı — "+src+" — "+d.articles.length+" madde bulundu"+sslNote+". Alınma zamanı: "+(d.fetched_at||"-");
   }
 }catch(err){
   current=null;
   sel.innerHTML="<option>Veri alınamadı</option>";
   st.className="status bad";
   st.textContent="Mevzuat.gov.tr üzerinden canlı veri alınamadı: "+err.message;
   document.querySelector("#result .body").textContent="";
 }
}

function showArticle(){
 if(!current)return;
 const a=current.articles[Number(document.getElementById("article").value||0)];
 const result=document.getElementById("result");
 result.querySelector("h2").textContent=current.ad+" — "+a.etiket;
 const titleEl=result.querySelector("#articleTitle");
 titleEl.textContent=a.baslik || "";
 titleEl.style.display=a.baslik ? "block" : "none";
 result.querySelector(".meta").innerHTML=
   'Kaynak: <a target="_blank" rel="noopener" href="'+current.kaynak+'">mevzuat.gov.tr resmî metni</a>'+
   " · Veri zamanı: "+(current.fetched_at||current.cache_time||"-");

 const bodyEl=result.querySelector(".body");
 const prefix=(a.gecici ? "GEÇİCİ MADDE " : "MADDE ")+a.madde_no+" –";
 const escaped=(a.metin||"").replace(/[&<>"']/g,function(c){
   return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
 });
 bodyEl.innerHTML='<strong>'+prefix+'</strong> '+escaped.replace(/\n/g,"<br>");
}

document.getElementById("law").addEventListener("change",loadLaw);
window.addEventListener("DOMContentLoaded",loadLaw);
</script>
</body>
</html>
