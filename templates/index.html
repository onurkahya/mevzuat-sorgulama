<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mevzuat Madde Sorgulama Sistemi</title>
<style>
:root{--dark:#050e3a;--navy:#0b1e6d;--card:#142b83;--gold:#f4c430;--red:#c0392b;--text:#edf2ff;--muted:#b9c6ee}
*{box-sizing:border-box}
body{margin:0;font-family:'Arial Narrow',Arial,Helvetica,sans-serif;background:linear-gradient(145deg,var(--dark),#0b1553 55%,#101b62);color:var(--text);min-height:100vh}
.topline{height:5px;background:var(--red)}
header{text-align:center;padding:30px 18px 20px}
.tc{font-size:13px;letter-spacing:2px;color:var(--gold);font-weight:800}
h1{margin:8px 0 6px;font-size:29px}
header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:1050px;margin:auto;padding:18px 20px 50px}
.card{background:rgba(20,43,131,.93);border:1px solid rgba(244,196,48,.35);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 16px 45px rgba(0,0,0,.2)}
.query-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;grid-template-rows:auto auto;gap:10px 26px;align-items:end}
label{display:block;color:var(--gold);font-size:13px;font-weight:800;margin-bottom:7px}
select,button{width:100%;padding:13px 14px;border-radius:9px;font-size:15px}
select{background:#fff;color:#111;border:1px solid #d9d9d9}
button{cursor:pointer;background:var(--gold);color:#111;font-weight:800;border:0}
button.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.status{margin-top:15px;padding:12px 14px;border-radius:9px;background:rgba(0,0,0,.2);font-size:13px;line-height:1.5}
.good{border-left:4px solid #61d095}.warn{border-left:4px solid var(--gold)}.bad{border-left:4px solid #ff7979}
.result{background:#fff;color:#111;border-radius:14px;padding:18px 22px;min-height:200px}
.result h2{margin:0 0 7px;color:#071960;font-size:21px;font-weight:800}.article-title{font-size:17px;font-weight:800;color:#111;margin:0 0 7px;padding:0;border:0}
.meta{display:none}
.body{white-space:normal;line-height:1.42;font-size:15px;text-align:justify;text-justify:inter-word}
a{color:#0b3aa4}
@media(max-width:700px){.actions{grid-template-columns:1fr}h1{font-size:23px}}

.query-law{grid-column:1;grid-row:1}
.query-fetch{grid-column:2;grid-row:1}
.query-article{grid-column:1;grid-row:2;max-width:475px}
.query-fonts{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.query-fetch button,.query-fonts button{height:48px}
.font-btn{
  background:transparent;
  color:#fff;
  border:1px solid rgba(255,255,255,.42);
  font-size:18px;
  font-weight:900;
  padding:8px
}
.status-card{padding:14px 18px}
.status-card .status{margin:0}
.print-card{padding:14px 18px;max-width:310px;margin-left:auto;margin-right:auto}
.print-card button{width:100%;max-width:100%;min-height:48px}
.site-footer{
  text-align:center;
  color:#cbd4f3;
  font-size:12px;
  line-height:1.5;
  padding:4px 10px 28px
}
.empty-result{
  color:#707070;
  font-style:italic;
  font-size:14px
}
.result h2{font-size:calc(21px + var(--font-delta,0px))}
.article-title{font-size:calc(17px + var(--font-delta,0px))}
.body{font-size:calc(15px + var(--font-delta,0px))}
select,button{font-size:calc(15px + var(--font-delta,0px))}
label,.status{font-size:calc(13px + var(--font-delta,0px))}
@media(max-width:700px){
  .query-grid{grid-template-columns:1fr;grid-template-rows:auto}
  .query-law,.query-fetch,.query-article,.query-fonts{grid-column:1;grid-row:auto;max-width:none}
}


.view-card{display:none}
.view-card.active{display:block}
.view-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.view-actions button{
  min-height:50px;
  background:#f4c833 !important;
  color:#111 !important;
  border:0 !important;
  font-weight:800 !important;
  box-shadow:0 5px 12px rgba(0,0,0,.20) !important;
}
.view-actions button:hover{
  transform:translateY(-1px);
}

.article-row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:end;margin-top:14px}
.article-row .query-fonts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#result{--result-font-delta:0px}
#result h2{font-size:calc(21px + var(--result-font-delta)) !important}
#result .article-title{font-size:calc(17px + var(--result-font-delta)) !important}
#result .body{font-size:calc(15px + var(--result-font-delta)) !important}
.full-law .full-article{margin:0 0 18px 0}
.full-law .full-article:last-child{margin-bottom:0}
.full-law .full-article-title{font-weight:800;font-size:calc(16px + var(--result-font-delta));margin:0 0 5px 0}
.full-law .full-article-body{font-size:calc(15px + var(--result-font-delta));line-height:1.42;text-align:justify}
.full-law .full-article-body strong{font-weight:800}
.print-header{display:none}
@media(max-width:700px){
  .view-actions{grid-template-columns:1fr}
  .article-row{grid-template-columns:1fr}
}

@page{
  size:A4 portrait;
  margin:1.5cm 2cm 2cm 2cm;
}
@media print{
  html,body{
    background:#fff !important;
    color:#000 !important;
    font-family:'Arial Narrow',Arial,Helvetica,sans-serif !important;
    margin:0 !important;
    padding:0 !important;
  }

  .topline,
  header,
  .query,
  .view-card,
  .status-card,
  .print-card,
  .site-footer{
    display:none !important;
  }

  .print-header{
    display:block !important;
    border:1px solid #8d8d8d !important;
    border-radius:10px !important;
    padding:10px 14px !important;
    margin:0 0 12px 0 !important;
    text-align:center !important;
    page-break-after:avoid !important;
  }

  .print-header .ministry{font-size:15pt !important;font-weight:800 !important;margin:0 0 3px 0 !important}

  .print-header .library{font-size:10pt !important;font-weight:700 !important;margin:0 !important}

  main{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
  }

  .card{
    background:#fff !important;
    border:0 !important;
    box-shadow:none !important;
    margin:0 !important;
    padding:0 !important;
  }

  .result{
    background:#fff !important;
    color:#000 !important;
    border:1px solid #9d9d9d !important;
    border-radius:10px !important;
    padding:12px 14px !important;
    margin:0 !important;
    min-height:0 !important;
    box-shadow:none !important;
    page-break-inside:avoid !important;
  }

  .result h2{
    color:#000 !important;
    font-size:11pt !important;
    line-height:1.2 !important;
    margin:0 0 7px 0 !important;
    padding:0 !important;
    font-weight:800 !important;
  }

  .article-title{
    color:#000 !important;
    font-size:10.5pt !important;
    line-height:1.2 !important;
    margin:0 0 5px 0 !important;
    padding:0 !important;
    font-weight:800 !important;
    border:0 !important;
  }

  .meta{
    display:none !important;
  }

  .body{
    color:#000 !important;
    font-size:10pt !important;
    line-height:1.38 !important;
    text-align:justify !important;
    text-justify:inter-word !important;
    white-space:normal !important;
    margin:0 !important;
    padding:0 !important;
  }

  .body strong{
    font-weight:800 !important;
  }

  .full-law .full-article{
    margin:0 0 10px 0 !important;
    page-break-inside:avoid !important;
  }

  .full-law .full-article-title{
    font-size:10.5pt !important;
    line-height:1.2 !important;
    margin:0 0 4px 0 !important;
  }

  .full-law .full-article-body{
    font-size:10pt !important;
    line-height:1.38 !important;
    text-align:justify !important;
  }

  a{
    color:#000 !important;
    text-decoration:none !important;
  }
}
</style>
</head>
<body>
<div class="topline"></div>
<header>
  <h1>T.C. Ticaret Bakanlığı</h1>
  <div class="eyebrow">Mevzuat Kütüphanesi</div>
</header>
<main>

<section class="card query">
 <div class="query-grid">
  <div class="query-law">
   <label>MEVZUAT</label>
   <select id="law">
    <option value="" selected>Lütfen Mevzuat Seçin</option>
    {% for key,item in mevzuatlar.items() %}
    <option value="{{key}}">{{item.ad}}</option>
    {% endfor %}
   </select>
  </div>

  <div class="query-fetch">
   <button onclick="loadLaw()">Mevzuatı Getir</button>
  </div>
 </div>
</section>

<section class="card view-card" id="viewCard">
 <div class="view-actions">
  <button type="button" onclick="showArticleMode()">Mevzuatı Madde Madde Görüntüle</button>
  <button type="button" onclick="showFullLaw()">Mevzuatın Tamamını Görüntüle</button>
 </div>

 <div class="article-row" id="articleControls" style="display:none">
  <div>
   <label>MADDE NUMARASI</label>
   <select id="article">
    <option value="">Madde seçin</option>
   </select>
  </div>
  <div class="query-fonts">
   <button type="button" class="font-btn" onclick="changeFont(-1)">A−</button>
   <button type="button" class="font-btn" onclick="changeFont(1)">A+</button>
  </div>
 </div>

 <div class="article-row" id="fullControls" style="display:none">
  <div></div>
  <div class="query-fonts">
   <button type="button" class="font-btn" onclick="changeFont(-1)">A−</button>
   <button type="button" class="font-btn" onclick="changeFont(1)">A+</button>
  </div>
 </div>
</section>

<div class="print-header">
 <div class="ministry">T.C. Ticaret Bakanlığı</div>
 <div class="library">Mevzuat Kütüphanesi</div>
</div>

<section class="card" id="resultCard" style="display:none">
 <div class="result" id="result">
  <h2></h2>
  <div class="article-title" id="articleTitle"></div>
  <div class="meta"></div>
  <div class="body"></div>
 </div>
</section>

<section class="card print-card" id="printCard" style="display:none">
 <button class="secondary" onclick="printSelected()">PDF / Yazdır</button>
</section>

</main>





<script>
let current=null;
let fontDelta=0;
let currentMode=null;

function escapeHtml(value){
 return (value||"").replace(/[&<>"']/g,function(c){
   return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
 });
}

function resetPage(){
 current=null;
 currentMode=null;
 fontDelta=0;

 document.getElementById("viewCard").classList.remove("active");
 document.getElementById("articleControls").style.display="none";
 document.getElementById("fullControls").style.display="none";
 document.getElementById("resultCard").style.display="none";
 document.getElementById("printCard").style.display="none";

 const result=document.getElementById("result");
 result.style.setProperty("--result-font-delta","0px");
 result.querySelector("h2").textContent="";
 result.querySelector("#articleTitle").textContent="";
 result.querySelector(".body").innerHTML="";
 result.querySelector(".body").className="body";

 const sel=document.getElementById("article");
 sel.innerHTML='<option value="">Madde seçin</option>';
}

async function loadLaw(){
 const key=document.getElementById("law").value;
 if(!key){
   resetPage();
   alert("Lütfen önce bir mevzuat seçin.");
   return;
 }

 const fetchBtn=document.querySelector(".query-fetch button");
 const oldText=fetchBtn.textContent;
 fetchBtn.disabled=true;
 fetchBtn.textContent="Mevzuat getiriliyor...";

 try{
   const response=await fetch("/api/mevzuat/"+encodeURIComponent(key),{cache:"no-store"});
   const d=await response.json();
   if(!d.ok) throw new Error(d.error||"Veri alınamadı.");

   current=d;
   currentMode=null;

   const sel=document.getElementById("article");
   sel.innerHTML='<option value="" selected>Madde seçin</option>';
   d.articles.forEach((a,i)=>{
      const o=document.createElement("option");
      o.value=i;
      o.textContent=a.etiket+(a.baslik ? " - "+a.baslik : "");
      sel.appendChild(o);
   });
   sel.onchange=showSelectedArticle;

   document.getElementById("viewCard").classList.add("active");
   document.getElementById("articleControls").style.display="none";
   document.getElementById("fullControls").style.display="none";
   document.getElementById("resultCard").style.display="none";
   document.getElementById("printCard").style.display="none";
 }catch(err){
   resetPage();
   alert("Resmî kaynaktan mevzuat alınamadı: "+err.message);
 }finally{
   fetchBtn.disabled=false;
   fetchBtn.textContent=oldText;
 }
}

function showArticleMode(){
 if(!current)return;
 currentMode="article";
 document.getElementById("articleControls").style.display="grid";
 document.getElementById("fullControls").style.display="none";
 document.getElementById("resultCard").style.display="none";
 document.getElementById("printCard").style.display="none";
 document.getElementById("article").value="";
}

function showSelectedArticle(){
 if(!current)return;
 const raw=document.getElementById("article").value;
 if(raw===""){
   document.getElementById("resultCard").style.display="none";
   document.getElementById("printCard").style.display="block";
   return;
 }

 const a=current.articles[Number(raw)];
 if(!a)return;

 currentMode="article";
 const result=document.getElementById("result");
 result.querySelector("h2").textContent=current.ad;

 const titleEl=result.querySelector("#articleTitle");
 titleEl.textContent=a.baslik || "";
 titleEl.style.display=a.baslik ? "block" : "none";

 const bodyEl=result.querySelector(".body");
 bodyEl.className="body";
 const prefix=(a.gecici ? "GEÇİCİ MADDE " : "MADDE ")+a.madde_no+" –";
 bodyEl.innerHTML='<strong>'+prefix+'</strong> '+escapeHtml(a.metin).replace(/\n/g,"<br>");

 document.getElementById("resultCard").style.display="block";
 document.getElementById("printCard").style.display="block";
}

function showFullLaw(){
 if(!current)return;

 currentMode="full";
 document.getElementById("articleControls").style.display="none";
 document.getElementById("fullControls").style.display="grid";

 const result=document.getElementById("result");
 result.querySelector("h2").textContent=current.ad;

 const titleEl=result.querySelector("#articleTitle");
 titleEl.textContent="";
 titleEl.style.display="none";

 const bodyEl=result.querySelector(".body");
 bodyEl.className="body full-law";

 let fullHtml="";
 current.articles.forEach(a=>{
   const prefix=(a.gecici ? "GEÇİCİ MADDE " : "MADDE ")+a.madde_no+" –";
   fullHtml+='<div class="full-article">';
   if(a.baslik){
     fullHtml+='<div class="full-article-title">'+escapeHtml(a.baslik)+'</div>';
   }
   fullHtml+='<div class="full-article-body"><strong>'+prefix+'</strong> '+
     escapeHtml(a.metin).replace(/\n/g,"<br>")+
     '</div></div>';
 });
 bodyEl.innerHTML=fullHtml;

 document.getElementById("resultCard").style.display="block";
 document.getElementById("printCard").style.display="none";
}

function changeFont(direction){
 fontDelta=Math.max(-2,Math.min(6,fontDelta+direction));
 document.getElementById("result").style.setProperty("--result-font-delta",fontDelta+"px");
}

function printSelected(){
 if(!current || !currentMode){
   alert("Önce görüntülenecek mevzuat veya maddeyi seçin.");
   return;
 }
 window.print();
}

document.getElementById("law").addEventListener("change",function(){
 resetPage();
});

window.addEventListener("DOMContentLoaded",function(){
 resetPage();
});
</script>

<footer class="site-footer">
 © Bu sayfa Onur KAHYA tarafından bilgilendirme amacıyla hazırlanmıştır 2026.
</footer>

</body>
</html>
