<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mevzuat Madde Sorgulama Sistemi</title>
<style>
:root{--dark:#050e3a;--navy:#0b1e6d;--card:#142b83;--gold:#f4c430;--red:#c0392b;--text:#edf2ff;--muted:#b9c6ee}
*{box-sizing:border-box}
body{margin:0;font-family:'Arial Narrow',Arial,Helvetica,sans-serif;background:linear-gradient(145deg,var(--dark),#0b1553 55%,#101b62);color:var(--text);min-height:100vh}
.topline{height:5px;background:var(--red)}
header{text-align:center;padding:30px 18px 20px}
.tc{font-size:13px;letter-spacing:2px;color:var(--gold);font-weight:800}
h1{margin:8px 0 6px;font-size:29px}
header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:1050px;margin:auto;padding:18px 20px 50px}
.card{background:rgba(20,43,131,.93);border:1px solid rgba(244,196,48,.35);border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 16px 45px rgba(0,0,0,.2)}
.query-grid{display:grid;grid-template-columns:minmax(0,1fr) 220px;grid-template-rows:auto auto;gap:10px 26px;align-items:end}
label{display:block;color:var(--gold);font-size:13px;font-weight:800;margin-bottom:7px}
select,button{width:100%;padding:13px 14px;border-radius:9px;font-size:15px}
select{background:#fff;color:#111;border:1px solid #d9d9d9}
button{cursor:pointer;background:var(--gold);color:#111;font-weight:800;border:0}
button.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.status{margin-top:15px;padding:12px 14px;border-radius:9px;background:rgba(0,0,0,.2);font-size:13px;line-height:1.5}
.good{border-left:4px solid #61d095}.warn{border-left:4px solid var(--gold)}.bad{border-left:4px solid #ff7979}
.result{background:#fff;color:#111;border-radius:14px;padding:18px 22px;min-height:200px}
.result h2{margin:0 0 7px;color:#071960;font-size:21px;font-weight:800}.article-title{font-size:17px;font-weight:800;color:#111;margin:0 0 7px;padding:0;border:0}
.meta{display:none}
.body{white-space:normal;line-height:1.42;font-size:15px;text-align:justify;text-justify:inter-word}
a{color:#0b3aa4}
@media(max-width:700px){.actions{grid-template-columns:1fr}h1{font-size:23px}}

.query-law{grid-column:1;grid-row:1}
.query-fetch{grid-column:2;grid-row:1}
.query-article{grid-column:1;grid-row:2;max-width:475px}
.query-fonts{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.query-fetch button,.query-fonts button{height:48px}
.font-btn{
  background:transparent;
  color:#fff;
  border:1px solid rgba(255,255,255,.42);
  font-size:18px;
  font-weight:900;
  padding:8px
}
.status-card{padding:14px 18px}
.status-card .status{margin:0}
.print-card{padding:14px 18px}
.print-card button{max-width:100%}
.site-footer{
  text-align:center;
  color:#cbd4f3;
  font-size:12px;
  line-height:1.5;
  padding:4px 10px 28px
}
.empty-result{
  color:#707070;
  font-style:italic;
  font-size:14px
}
.result h2{font-size:calc(21px + var(--font-delta,0px))}
.article-title{font-size:calc(17px + var(--font-delta,0px))}
.body{font-size:calc(15px + var(--font-delta,0px))}
select,button{font-size:calc(15px + var(--font-delta,0px))}
label,.status{font-size:calc(13px + var(--font-delta,0px))}
@media(max-width:700px){
  .query-grid{grid-template-columns:1fr;grid-template-rows:auto}
  .query-law,.query-fetch,.query-article,.query-fonts{grid-column:1;grid-row:auto;max-width:none}
}

@page{
  size:A4 portrait;
  margin:1.5cm 2cm 2cm 2cm;
}
@media print{
  html,body{
    background:#fff !important;
    color:#000 !important;
    font-family:'Arial Narrow',Arial,Helvetica,sans-serif !important;
    margin:0 !important;
    padding:0 !important;
  }

  .topline,
  header,
  .query,
  .status-card,
  .print-card,
  .site-footer{
    display:none !important;
  }

  main{
    width:100% !important;
    max-width:none !important;
    margin:0 !important;
    padding:0 !important;
  }

  .card{
    background:#fff !important;
    border:0 !important;
    box-shadow:none !important;
    margin:0 !important;
    padding:0 !important;
  }

  .result{
    background:#fff !important;
    color:#000 !important;
    border:1px solid #9d9d9d !important;
    border-radius:10px !important;
    padding:12px 14px !important;
    margin:0 !important;
    min-height:0 !important;
    box-shadow:none !important;
    page-break-inside:avoid !important;
  }

  .result h2{
    color:#000 !important;
    font-size:11pt !important;
    line-height:1.2 !important;
    margin:0 0 7px 0 !important;
    padding:0 !important;
    font-weight:800 !important;
  }

  .article-title{
    color:#000 !important;
    font-size:10.5pt !important;
    line-height:1.2 !important;
    margin:0 0 5px 0 !important;
    padding:0 !important;
    font-weight:800 !important;
    border:0 !important;
  }

  .meta{
    display:none !important;
  }

  .body{
    color:#000 !important;
    font-size:10pt !important;
    line-height:1.38 !important;
    text-align:justify !important;
    text-justify:inter-word !important;
    white-space:normal !important;
    margin:0 !important;
    padding:0 !important;
  }

  .body strong{
    font-weight:800 !important;
  }

  a{
    color:#000 !important;
    text-decoration:none !important;
  }
}
</style>
</head>
<body>
<div class="topline"></div>
<header>
 <div class="tc">T.C. MEVZUAT MADDE SORGULAMA</div>
 <h1>Mevzuat Madde Sorgulama Sistemi</h1>
 <p>Canlı kaynak: mevzuat.gov.tr</p>
</header>
<main>
<section class="card query">
 <div class="query-grid">
  <div class="query-law">
   <label>MEVZUAT</label>
   <select id="law">
    <option value="" selected>Lütfen Mevzuat Seçin</option>
    {% for key,item in mevzuatlar.items() %}
    <option value="{{key}}">{{item.ad}}</option>
    {% endfor %}
   </select>
  </div>

  <div class="query-fetch">
   <button onclick="loadLaw()">Seçili Mevzuatı Getir</button>
  </div>

  <div class="query-article">
   <label>MADDE NUMARASI</label>
   <select id="article" disabled>
    <option value="">Önce mevzuat seçin</option>
   </select>
  </div>

  <div class="query-fonts">
   <button type="button" class="font-btn" onclick="changeFont(-1)">A−</button>
   <button type="button" class="font-btn" onclick="changeFont(1)">A+</button>
  </div>
 </div>
</section>

<section class="card" id="resultCard">
 <div class="result" id="result">
  <h2>Mevzuat Madde Sorgulama</h2>
  <div class="article-title" id="articleTitle"></div>
  <div class="meta"></div>
  <div class="body empty-result">Lütfen önce bir mevzuat seçerek “Seçili Mevzuatı Getir” düğmesine basın.</div>
 </div>
</section>

<section class="card status-card">
 <div id="status" class="status warn">Henüz bir mevzuat seçilmedi.</div>
</section>

<section class="card print-card">
 <button class="secondary" onclick="printSelected()">PDF / Yazdır</button>
</section>
</main>

<footer class="site-footer">
 © Bu sayfa Onur KAHYA tarafından bilgilendirme amacıyla hazırlanmıştır 2026.
</footer>

<script>
let current=null;
let fontDelta=0;

function setStatus(message,type="warn"){
 const st=document.getElementById("status");
 st.className="status "+type;
 st.textContent=message;
}

function resetResult(){
 current=null;
 const sel=document.getElementById("article");
 sel.disabled=true;
 sel.innerHTML='<option value="">Önce mevzuat seçin</option>';

 const result=document.getElementById("result");
 result.querySelector("h2").textContent="Mevzuat Madde Sorgulama";
 const titleEl=result.querySelector("#articleTitle");
 titleEl.textContent="";
 titleEl.style.display="none";

 const bodyEl=result.querySelector(".body");
 bodyEl.className="body empty-result";
 bodyEl.textContent='Lütfen önce bir mevzuat seçerek “Seçili Mevzuatı Getir” düğmesine basın.';
}

async function loadLaw(){
 const key=document.getElementById("law").value;
 const sel=document.getElementById("article");

 if(!key){
   resetResult();
   setStatus("Lütfen önce bir mevzuat seçin.","warn");
   return;
 }

 setStatus("Resmî kaynaktan güncel metin alınıyor...","warn");
 sel.disabled=true;
 sel.innerHTML="<option>Yükleniyor...</option>";

 try{
   const response=await fetch("/api/mevzuat/"+encodeURIComponent(key),{cache:"no-store"});
   const d=await response.json();
   if(!d.ok) throw new Error(d.error||"Veri alınamadı.");

   current=d;
   sel.innerHTML="";
   d.articles.forEach((a,i)=>{
      const o=document.createElement("option");
      o.value=i;
      o.textContent=a.etiket+(a.baslik ? " - "+a.baslik : "");
      sel.appendChild(o);
   });

   sel.disabled=false;
   sel.onchange=showArticle;
   showArticle();

   if(d.from_cache){
      setStatus(
        "Canlı kaynak o anda alınamadı. Son başarılı kopya gösteriliyor. Kayıt zamanı: "+(d.cache_time||"-"),
        "warn"
      );
   }else{
      const src=d.source_type==="canli_html" ? "Canlı HTML" : (d.source_type==="resmi_html" ? "Resmî Gazete HTML" : "Resmî PDF");
      const sslNote=d.ssl_fallback ? " — SSL doğrulama yedeği kullanıldı" : "";
      setStatus(
        "Güncel kaynak başarılı — "+src+" — "+d.articles.length+" madde bulundu"+sslNote+
        ". Alınma zamanı: "+(d.fetched_at||"-"),
        "good"
      );
   }
 }catch(err){
   current=null;
   sel.innerHTML="<option>Veri alınamadı</option>";
   setStatus("Resmî kaynaktan canlı veri alınamadı: "+err.message,"bad");

   const body=document.querySelector("#result .body");
   body.className="body empty-result";
   body.textContent="Seçilen mevzuatın güncel metni alınamadı.";
 }
}

function showArticle(){
 if(!current)return;

 const index=Number(document.getElementById("article").value||0);
 const a=current.articles[index];
 if(!a)return;

 const result=document.getElementById("result");
 result.querySelector("h2").textContent=current.ad;

 const titleEl=result.querySelector("#articleTitle");
 titleEl.textContent=a.baslik || "";
 titleEl.style.display=a.baslik ? "block" : "none";

 const bodyEl=result.querySelector(".body");
 bodyEl.className="body";

 const prefix=(a.gecici ? "GEÇİCİ MADDE " : "MADDE ")+a.madde_no+" –";
 const escaped=(a.metin||"").replace(/[&<>"']/g,function(c){
   return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c];
 });

 bodyEl.innerHTML='<strong>'+prefix+'</strong> '+escaped.replace(/\n/g,"<br>");
}

function changeFont(direction){
 fontDelta=Math.max(-2,Math.min(6,fontDelta+direction));
 document.documentElement.style.setProperty("--font-delta",fontDelta+"px");
}

function printSelected(){
 if(!current){
   setStatus("PDF/Yazdır için önce bir mevzuat ve madde seçin.","warn");
   return;
 }
 window.print();
}

document.getElementById("law").addEventListener("change",function(){
 resetResult();
 if(this.value){
   setStatus('Mevzuat seçildi. “Seçili Mevzuatı Getir” düğmesine basın.',"warn");
 }else{
   setStatus("Henüz bir mevzuat seçilmedi.","warn");
 }
});

window.addEventListener("DOMContentLoaded",function(){
 resetResult();
 setStatus("Henüz bir mevzuat seçilmedi.","warn");
});
</script>
</body>
</html>
